name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev,lexical,mcp]"
      - name: Check dependencies
        run: python -m pip check
      - name: Check CLI
        run: dwago --help
      - name: Run tests
        run: python -m pytest

  native:
    name: Python 3.12 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev,lexical,mcp]"
      - name: Check dependencies
        run: python -m pip check
      - name: Check CLI
        run: dwago --help
      - name: Report native symlink capability
        shell: python
        run: |
          import json
          import platform
          import tempfile
          from pathlib import Path

          capabilities = []
          with tempfile.TemporaryDirectory() as temporary:
              root = Path(temporary)
              for directory in (False, True):
                  kind = "directory" if directory else "file"
                  target = root / kind
                  target.mkdir() if directory else target.write_text("probe")
                  link = root / (kind + "-link")
                  try:
                      link.symlink_to(target, target_is_directory=directory)
                  except OSError as error:
                      capabilities.append({"kind": kind, "available": False, "error": str(error)})
                  else:
                      capabilities.append({"kind": kind, "available": link.is_symlink() and link.exists()})
          print(json.dumps({"platform": platform.platform(), "symlinks": capabilities}))
      - name: Run tests with skip reasons
        run: python -m pytest -ra
