<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">

<title>The Brain</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; background:#070b14; }
  canvas { position:fixed; inset:0; width:100%; height:100%; }
  #gl { cursor:grab; }
  #gl.grabbing { cursor:grabbing; }
  #hud { pointer-events:none; }
  #brand { position:fixed; left:22px; bottom:18px; z-index:3; pointer-events:none;
    font:600 13px/1.4 system-ui,sans-serif; color:rgba(224,236,255,.88);
    letter-spacing:.18em; text-transform:uppercase; text-shadow:0 1px 12px rgba(0,0,0,.8); }
  #brand small { display:block; font-weight:400; letter-spacing:.03em;
    text-transform:none; color:rgba(160,180,210,.75); margin-top:3px; }
  #hint { position:fixed; right:22px; bottom:18px; z-index:3; text-align:right;
    pointer-events:none; font:400 11.5px/1.65 system-ui,sans-serif;
    color:rgba(160,180,210,.65); text-shadow:0 1px 8px rgba(0,0,0,.8); }
  #tip { position:fixed; display:none; z-index:4; pointer-events:none;
    background:rgba(8,12,24,.94); border:1px solid rgba(255,196,110,.30);
    color:#f2e8d8; font:500 12px ui-monospace,Menlo,monospace;
    padding:5px 10px; border-radius:7px; white-space:nowrap; }
  #card { position:fixed; display:none; z-index:4; right:20px; top:20px; width:252px;
    background:rgba(8,12,24,.92); border:1px solid rgba(255,196,110,.26);
    border-radius:13px; padding:15px 17px; backdrop-filter:blur(14px);
    box-shadow:0 12px 40px rgba(0,0,0,.55); color:#eef2ff;
    font:400 12px/1.5 system-ui,sans-serif; }
  #card b { display:block; font:600 14px system-ui,sans-serif; margin-bottom:2px; }
  #card span { display:block; font:400 10.5px ui-monospace,monospace;
    color:rgba(170,188,214,.9); word-break:break-all; margin-bottom:8px; }
  #card em { display:block; font-style:normal; font:600 10px system-ui,sans-serif;
    letter-spacing:.08em; text-transform:uppercase; color:#ffc46e; margin-bottom:6px; }
  #card i { display:block; font-style:normal; color:rgba(178,194,220,.85); }
  #panel { position:fixed; left:18px; top:50%; transform:translateY(-50%); z-index:5;
    display:flex; flex-direction:column; gap:4px; width:122px;
    padding:6px;
    border-radius:15px;
    border:1px solid rgba(255,255,255,.11);
    background:
      linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,0) 42%),
      rgba(16,21,34,.74);
    box-shadow:0 8px 22px rgba(4,8,16,.30), inset 0 1px rgba(255,255,255,.06);
    isolation:isolate; }
  #panel b { font:500 8.5px system-ui,sans-serif; letter-spacing:.20em;
    color:rgba(196,208,228,.42); margin:7px 8px 3px; }
  #panel b:first-child { margin-top:3px; }
  #panel button { all:unset; position:relative; cursor:pointer; text-align:center;
    font:500 10.5px system-ui,sans-serif; letter-spacing:.14em; text-transform:uppercase;
    color:rgba(196,208,228,.55);
    padding:9px 4px; border-radius:10px;
    border:1px solid transparent;
    background:rgba(255,255,255,.04);
    transition:color .18s cubic-bezier(.25,.1,.25,1),
               border-color .2s cubic-bezier(.25,.1,.25,1),
               background .2s cubic-bezier(.25,.1,.25,1),
               box-shadow .2s cubic-bezier(.25,.1,.25,1); }
  #panel button:hover { color:rgba(240,246,252,.95); background:rgba(255,255,255,.075); }
  #panel button.on {
    color:#171c14;
    background:#f4f2ea; border-color:#f4f2ea;
    box-shadow:0 6px 16px rgba(4,8,16,.24); }
  #panel button:focus-visible { outline:2px solid rgba(240,246,232,.9); outline-offset:2px; }
  /* entrance: staggered clip wipe, sylva-style */
  #panel button, #panel b { clip-path:inset(0 0 105% 0); }
  .ui-ready #panel button, .ui-ready #panel b {
    clip-path:inset(0 0 -30% 0);
    transition:clip-path .9s cubic-bezier(.16,1,.3,1) var(--d,0ms),
               color .18s cubic-bezier(.25,.1,.25,1),
               border-color .2s cubic-bezier(.25,.1,.25,1),
               background .2s cubic-bezier(.25,.1,.25,1),
               box-shadow .2s cubic-bezier(.25,.1,.25,1); }
  /* specular rim: a lit border edge that points at the pointer */
  #card { right:196px; }
  #files { position:fixed; right:18px; top:50%; transform:translateY(-50%); z-index:5;
    display:flex; flex-direction:column; width:168px; max-height:72vh;
    padding:6px; border-radius:15px;
    border:1px solid rgba(255,255,255,.11);
    background:
      linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,0) 42%),
      rgba(16,21,34,.74);
    box-shadow:0 8px 22px rgba(4,8,16,.30), inset 0 1px rgba(255,255,255,.06);
    isolation:isolate; }
  #files input { all:unset; box-sizing:border-box; width:100%; padding:8px 10px; margin-bottom:4px;
    border-radius:10px; border:1px solid transparent; background:rgba(255,255,255,.05);
    font:500 10.5px ui-monospace,Menlo,monospace; letter-spacing:.04em;
    color:rgba(240,246,252,.9); }
  #files input::placeholder { color:rgba(196,208,228,.38); }
  #files input:focus { border-color:rgba(240,246,232,.35); }
  #flist { overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin;
    scrollbar-color:rgba(255,255,255,.14) transparent; }
  #flist b { display:block; font:500 8.5px system-ui,sans-serif; letter-spacing:.18em;
    text-transform:uppercase; color:rgba(196,208,228,.42); margin:8px 8px 3px; }
  .frow { display:flex; align-items:center; gap:7px; padding:5px 8px; border-radius:8px;
    border:1px solid transparent; cursor:pointer;
    font:500 10.5px ui-monospace,Menlo,monospace; color:rgba(196,208,228,.62);
    transition:color .18s cubic-bezier(.25,.1,.25,1), background .2s cubic-bezier(.25,.1,.25,1); }
  .frow i { flex:none; width:6px; height:6px; border-radius:50%; }
  .frow:hover { color:rgba(240,246,252,.95); background:rgba(255,255,255,.075); }
  .frow.sel { color:#171c14; background:#f4f2ea; box-shadow:0 4px 12px rgba(4,8,16,.24); }
  #mini { position:fixed; left:18px; top:16px; z-index:5; width:196px; height:150px;
    cursor:pointer; }
  #minilab { position:fixed; left:18px; top:168px; z-index:5; width:196px; text-align:center;
    pointer-events:none; font:500 8.5px system-ui,sans-serif; letter-spacing:.20em;
    text-transform:uppercase; color:rgba(196,208,228,.42); }
  [data-spec]{ --spec-angle:2.4rad; --spec-bright:0; }
  [data-spec]::after{
    content:''; position:absolute; inset:-1px; z-index:5;
    padding:1px; border-radius:inherit; pointer-events:none;
    opacity:var(--spec-bright);
    background:conic-gradient(from var(--spec-angle) at 50% 50%,
      rgba(240,246,232,0) 0deg, rgba(240,246,232,.08) 14deg, rgba(240,246,232,.95) 28deg,
      rgba(240,246,232,.16) 46deg, rgba(240,246,232,0) 68deg, rgba(240,246,232,0) 180deg,
      rgba(240,246,232,.08) 194deg, rgba(240,246,232,.95) 208deg, rgba(240,246,232,.16) 226deg,
      rgba(240,246,232,0) 248deg, rgba(240,246,232,0) 360deg);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude; }
</style>
</head><body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="brand">d<b style="color:#ffc46e">w</b>ago<small>the brain · alive</small></div>
<div id="hint">drag — turn · scroll — closer<br>click a lobe — open it and watch it think · click a neuron — its file</div>
<div id="tip"></div>
<div id="card"></div>
<div id="mini" title="click a lobe"></div>
<div id="minilab">regions</div>
<div id="files" data-spec>
  <input id="fsearch" type="text" placeholder="find a file…" spellcheck="false">
  <div id="flist"></div>
</div>
<div id="panel" data-spec>
  <b style="--d:60ms">VIEW</b>
  <button id="v0" class="on" data-spec style="--d:120ms">FULL</button>
  <button id="v1" data-spec style="--d:180ms">NEURONS</button>
  <button id="v2" data-spec style="--d:240ms">X-RAY</button>
  <b style="--d:300ms">OVERLAY</b>
  <button id="bImp" data-spec style="--d:360ms">KEY FILES</button>
  <button id="bRot" class="on" data-spec style="--d:420ms">ROTATE</button>
</div>

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   THE BRAIN — sculpted. A true displaced-surface model: ~190k triangles,
   grid-derived normals so every gyrus ridge catches key light and specular
   sheen, fresnel rim, a semi-translucent shell over an electric interior,
   a low-poly scan-web on the skin, gold spark dust, flowing fiber tracts,
   and a real post-process bloom. Files are its neurons. It thinks.
   ═══════════════════════════════════════════════════════════════════════ */
const cv = document.getElementById('gl');
const hud = document.getElementById('hud');
const hctx = hud.getContext('2d');
const gl = cv.getContext('webgl2', { antialias:false, alpha:false,
                                     preserveDrawingBuffer:true });
if (!gl) { document.body.innerHTML='<p style="color:#89a;padding:40px;font:14px sans-serif">WebGL2 required.</p>'; throw 0; }

/* ── noise ──────────────────────────────────────────────────────────────── */
function rng(seed){let a=seed;return()=>{a|=0;a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;};}
const R = rng(1337);
const PERM = new Uint8Array(512);
{ const p=[...Array(256).keys()]; const rr=rng(77);
  for(let i=255;i>0;i--){const j=(rr()*(i+1))|0;[p[i],p[j]]=[p[j],p[i]];}
  for(let i=0;i<512;i++)PERM[i]=p[i&255]; }
function vhash(x,y,z){ return PERM[(PERM[(PERM[x&255]+y)&255]+z)&255]/255; }
function vnoise(x,y,z){
  const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z);
  const xf=x-xi,yf=y-yi,zf=z-zi;
  const q=t=>t*t*(3-2*t);
  const u=q(xf),v=q(yf),w=q(zf);
  const l=(a,b,t)=>a+(b-a)*t;
  return l(
    l(l(vhash(xi,yi,zi),vhash(xi+1,yi,zi),u), l(vhash(xi,yi+1,zi),vhash(xi+1,yi+1,zi),u), v),
    l(l(vhash(xi,yi,zi+1),vhash(xi+1,yi,zi+1),u), l(vhash(xi,yi+1,zi+1),vhash(xi+1,yi+1,zi+1),u), v),
    w);
}
function fbm(x,y,z){ let v=0,a=.5;
  for(let o=0;o<4;o++){ v+=a*vnoise(x,y,z); x=x*2.03+7.1;y=y*2.03+3.7;z=z*2.03+9.3; a*=.5; }
  return v; }
function ridged(x,y,z){ let v=0,a=.55;
  for(let o=0;o<4;o++){ v+=a*(1-Math.abs(2*vnoise(x,y,z)-1)); x=x*2.07+3.1;y=y*2.07+8.9;z=z*2.07+5.3; a*=.5; }
  return v; }

/* ── anatomy ────────────────────────────────────────────────────────────── */
function sstep(a,b,x){ const t=Math.max(0,Math.min(1,(x-a)/(b-a))); return t*t*(3-2*t); }
const TILT=-.06, TC=Math.cos(TILT), TS=Math.sin(TILT);
function tilt(x,y,z){ return [x, TC*y-TS*z, TS*y+TC*z]; }
/* x = left-right · y = up-down · z = front(+)/back(-) */
function gyralPhase(dx,dy,dz){
  /* real gyri flow: concentric arcs around the sylvian core, wrapping the
     frontal & occipital poles, running parasagittal over the crown */
  const sx=dx<0?-1:1;
  const vS=Math.hypot(dx-.80*sx, dy+.12, dz-.18);      /* sylvian notch    */
  /* lateral gyri run as antero-posterior strata arcing over the dome,
     locally bent around the sylvian notch; hemispheres offset so they
     never mirror-match */
  const el=Math.atan2(dy, Math.hypot(dx,dz));          /* latitude         */
  const bend=3.2*Math.exp(-Math.pow(vS-.30,2)*5.5);
  const hemi=(dx<0?0:1.9);
  /* anisotropic labyrinth: organic branching worms with a horizontal grain */
  const base=fbm(dx*2.6, dy*4.4, dz*1.8);
  return base*46. + el*9. + bend + hemi;
}
function cortexRadius(dx,dy,dz){
  let rx=.84, ry=.70, rz=1.00;
  const ax=Math.abs(dx);
  if (dy<0) ry*=.74+.22*sstep(.22,.85,ax)+.10*Math.max(0,-dz);
  const front = Math.max(0,dz);
  rx *= 1-.14*front*front;
  ry *= 1-.08*front*front;
  const temporal = Math.exp(-Math.pow(ax-.62,2)*4.5)
                 * Math.exp(-Math.pow(dy+.46,2)*4.2)
                 * Math.exp(-Math.pow(dz-.20,2)*1.6);
  const sylvian = Math.exp(-Math.pow(ax-.88,2)*7)
                * Math.exp(-Math.pow(dy+.10,2)*9)
                * Math.exp(-Math.pow(dz-.22,2)*2.4);
  const dome = Math.exp(-Math.pow(dy-1.,2)*2.6);
  const bulge = 1 + temporal*.28 - sylvian*.06 + dome*.05;
  let r = 1/Math.sqrt((dx*dx)/(rx*rx)+(dy*dy)/(ry*ry)+(dz*dz)/(rz*rz));
  r *= bulge;
  const fis = Math.exp(-(dx*dx)/.0035) * sstep(.1,.55,dy);
  r *= 1-.13*Math.min(1,fis);
  /* gyri follow anatomy: flow-field arcs, fat crests, deep narrow sulci */
  const gp=gyralPhase(dx,dy,dz);
  const meander=(fbm(dx*6.5+7.7, dy*6.5+1.3, dz*6.5+4.9)-.5)*3.4;
  const band=Math.sin(gp + meander);
  const f=sstep(-.75,-.06,band);
  const micro=ridged(dx*9,dy*9,dz*9);
  r *= 1 + .072*(f-.5) + .008*(micro-.55) + .026*(fbm(dx*1.15+3.3,dy*1.15,dz*1.15)-.5);
  return { r, fold: f, fis: Math.min(1,fis) };
}
function regionOf(dx,dy,dz){
  const L = dx<0;
  if (dz > .30) return L?0:1;
  if (dz < -.45 && dy > -.1) return 6;
  if (dy < -.12 && Math.abs(dx) > .32) return L?4:5;
  return L?2:3;
}
/*__DWAGO_DATA__*/
const DATA=window.DWAGO_DATA||null;
const ZONE=['frontal · L','frontal · R','parietal · L','parietal · R',
            'temporal · L','temporal · R','occipital','cerebellum'];
const REGION_NAME=DATA?DATA.regions.map((r,i)=>r.name):ZONE.slice();
const DIRS=DATA?DATA.regions.map(r=>r.name):['src/auth','src/api','core/engine','core/store',
            'ui/components','services/billing','infra/queue','lib/utils'];

/* ── spectrum: violet occiput → indigo crown → molten amber-gold front ──── */
const STOPS=[
  [ .46,.22,1.00],
  [ .22,.44,1.00],
  [ .15,.37,.68],
  [1.00,.52,.16],
  [1.00,.82,.30],
];
function spectra(x,y,z){
  const t=Math.max(0,Math.min(1,(z+1)/2));
  const seg=t<.44?[0,1,t/.44] : t<.62?[1,2,(t-.44)/.18]
          : t<.84?[2,3,(t-.62)/.22] : [3,4,(t-.84)/.16];
  const A=STOPS[seg[0]],B=STOPS[seg[1]],u=seg[2];
  let c=[A[0]+(B[0]-A[0])*u, A[1]+(B[1]-A[1])*u, A[2]+(B[2]-A[2])*u];
  const fur=Math.exp(-Math.pow(z-.45,2)*2.2 - Math.pow(y+.42,2)*3.5);
  c=[c[0]+(1.05-c[0])*fur*.92, c[1]+(.50-c[1])*fur*.92, c[2]+(.13-c[2])*fur*.92];
  const crown=sstep(.30,.75,y);
  c=[c[0]+(.30-c[0])*crown*.38, c[1]+(.52-c[1])*crown*.38, c[2]+(1.0-c[2])*crown*.38];
  return c;
}

/* ── mesh builder: lat-long grid, poles on ±x, grid-difference normals ──── */
/* dir(θ,φ): poles on ±y — x=sinθ·cosφ · y=cosθ · z=sinθ·sinφ */
function buildSurface(NT,NP, radiusFn, centre, foldOf){
  const VW=NP+1;
  const nv=(NT+1)*VW;
  const pos=new Float32Array(nv*3), nrm=new Float32Array(nv*3);
  const col=new Float32Array(nv*3), aux=new Float32Array(nv*4);
  const P=(it,ip)=>((it*VW)+ip)*3;
  for(let it=0;it<=NT;it++){
    const th=it/NT*Math.PI;
    const ct=Math.cos(th), st=Math.sin(th);
    for(let ip=0;ip<=VW-1;ip++){
      const ph=ip/NP*2*Math.PI;
      const dx=st*Math.cos(ph), dy=ct, dz=st*Math.sin(ph);
      const {r,fold,fis}=radiusFn(dx,dy,dz);
      const px=centre[0]+dx*r, py=centre[1]+dy*r, pz=centre[2]+dz*r;
      const tp=tilt(px,py,pz);
      const o=P(it,ip);
      pos[o]=tp[0];pos[o+1]=tp[1];pos[o+2]=tp[2];
      const c=spectra(px,py,pz);
      col[o]=c[0];col[o+1]=c[1];col[o+2]=c[2];
      const o4=((it*VW)+ip)*4;
      aux[o4]=fold; aux[o4+1]=regionOf(dx,dy,dz);
      aux[o4+2]=R()<.02?1:0; aux[o4+3]=fis;
    }
  }
  /* normals from grid neighbours */
  for(let it=0;it<=NT;it++){
    for(let ip=0;ip<=NP;ip++){
      const o=P(it,ip);
      const itA=Math.max(0,it-1), itB=Math.min(NT,it+1);
      const ipA=(ip-1+NP)%NP, ipB=(ip+1)%NP;
      const a=P(itA,ip), b=P(itB,ip), c2=P(it,ipA), d2=P(it,ipB);
      const t1=[pos[b]-pos[a],pos[b+1]-pos[a+1],pos[b+2]-pos[a+2]];
      const t2=[pos[d2]-pos[c2],pos[d2+1]-pos[c2+1],pos[d2+2]-pos[c2+2]];
      let nx=t1[1]*t2[2]-t1[2]*t2[1],
          ny=t1[2]*t2[0]-t1[0]*t2[2],
          nz=t1[0]*t2[1]-t1[1]*t2[0];
      const L=Math.hypot(nx,ny,nz)||1;
      nx/=L;ny/=L;nz/=L;
      /* orient outward */
      const cx=pos[o]-centre[0], cy=pos[o+1]-centre[1], cz=pos[o+2]-centre[2];
      if(nx*cx+ny*cy+nz*cz<0){nx=-nx;ny=-ny;nz=-nz;}
      nrm[o]=nx;nrm[o+1]=ny;nrm[o+2]=nz;
    }
  }
  const idx=new Uint32Array(NT*NP*6);
  let k=0;
  for(let it=0;it<NT;it++)for(let ip=0;ip<NP;ip++){
    const a=it*VW+ip, b=a+1, c3=a+VW, d3=c3+1;
    idx[k++]=a;idx[k++]=c3;idx[k++]=b;
    idx[k++]=b;idx[k++]=c3;idx[k++]=d3;
  }
  return {pos,nrm,col,aux,idx,count:idx.length};
}
const cortexMesh=buildSurface(340,440,cortexRadius,[0,0,0]);
function cerebRadius(dx,dy,dz){
  let r=1/Math.sqrt((dx*dx)/(.36*.36)+(dy*dy)/(.22*.22)+(dz*dz)/(.28*.28));
  const stria=.5+.5*Math.sin(Math.asin(Math.max(-1,Math.min(1,dy)))*34+dy*46);
  const folia=.5+.5*Math.sin(dy*60+fbm(dx*3,dy*3,dz*3)*4);
  r*=1+.034*(folia-.5);
  return { r, fold:.25+.75*folia, fis:0 };
}
const cerebMesh=buildSurface(120,150,cerebRadius,[0,-.40,-.64]);
function stemRadius(dx,dy,dz){
  let r=1/Math.sqrt((dx*dx)/(.10*.10)+(dy*dy)/(.30*.30)+(dz*dz)/(.075*.075));
  r*=1+.05*(fbm(dx*4,dy*4,dz*4)-.5);
  return { r, fold:.5, fis:0 };
}
const stemMesh=buildSurface(60,40,stemRadius,[0,-.62,-.28]);

/* ── low-poly scan web on the skin ──────────────────────────────────────── */
/* organic node-and-wire lattice: knn web over the surface */
const webVerts=[], webCols=[], webRegs=[];
const NLAT=2600;
const latP=new Float32Array(NLAT*3), latC=new Float32Array(NLAT*3),
      latS=new Float32Array(NLAT), latR=new Float32Array(NLAT);
{
  const nodes=[];
  let i=0;
  while(i<NLAT){
    let dx=R()*2-1, dy=R()*2-1, dz=R()*2-1;
    const L=Math.hypot(dx,dy,dz); if(L<1e-4||L>1)continue;
    dx/=L;dy/=L;dz/=L;
    const {r,fold}=cortexRadius(dx,dy,dz);
    const D=dissolveOf(dz*r);
    if(R()>.28+.72*D) continue;
    const tp=tilt(dx*r*1.010, dy*r*1.010, dz*r*1.010);
    const c=spectra(dx*r,dy*r,dz*r);
    const lum=(.35+.65*D)*(.6+.6*fold);
    const reg=regionOf(dx,dy,dz);
    nodes.push({p:tp,c,reg,D,lum});
    latP[i*3]=tp[0];latP[i*3+1]=tp[1];latP[i*3+2]=tp[2];
    latC[i*3]=c[0]*lum*2.1;latC[i*3+1]=c[1]*lum*2.1;latC[i*3+2]=c[2]*lum*2.1;
    latS[i]=1.5+1.9*R()+D*1.2;
    latR[i]=reg;
    i++;
  }
  for(let a=0;a<NLAT;a++){
    const dists=[];
    const A=nodes[a];

function miniRegionAt(mx,my){
  /* mx,my local to the 196x150 mini box */
  const ndx=(mx/196*2-1)*(196/150), ndy=1-my/150*2;
  const cy=Math.cos(yaw),sy=Math.sin(yaw),cx=Math.cos(pitch),sx=Math.sin(pitch);
  for(let zc=1.3;zc<4.2;zc+=.02){
    const px=ndx*zc/2.1, py=ndy*zc/2.1, pz=zc-2.6;
    const y1=cx*py+sx*pz, z1=-sx*py+cx*pz;
    const x2=cy*px-sy*z1, z2=sy*px+cy*z1;
    const sc=.95;
    const wx=x2/sc, wy=y1/sc, wz=z2/sc;
    const oy=TC*wy+TS*wz, oz=-TS*wy+TC*wz;
    const cb=Math.pow(wx/.36,2)+Math.pow((oy+.40)/.22,2)+Math.pow((oz+.64)/.28,2);
    if(cb<=1) return 7;
    const len=Math.hypot(wx,oy,oz); if(len<1e-4) continue;
    const dxx=wx/len, dyy=oy/len, dzz=oz/len;
    if(len<=cortexRadius(dxx,dyy,dzz).r) return regionOf(dxx,dyy,dzz);
  }
  return -1;
}

let breathNow=1;
function project(p,out){
  let x=p[0]*scale*breathNow,y=p[1]*scale*breathNow,z=p[2]*scale*breathNow;
  const cy=Math.cos(yaw),sy=Math.sin(yaw);
  let x1=cy*x+sy*z, z1=-sy*x+cy*z;
  const cx=Math.cos(pitch),sx=Math.sin(pitch);
  let y1=cx*y-sx*z1, z2=sx*y+cx*z1;
  const zc=z2+2.6; if(zc<.2)return false;
  const f=2.1/zc;
  out[0]=(x1*f/(W/H))*(W/2)+W/2;
  out[1]=H/2-(y1*f)*(H/2);
  out[2]=zc;
  return true;
}
const _p=[0,0,0];

    const dx=_p[0]-mx,dy=_p[1]-my,d=dx*dx+dy*dy;

}

function attribs(binds){

function frame(ts){
  const dt=Math.min(2.5,last?(ts-last)/16.7:1);last=ts;
  if(!down&&autoRot){yawT+=.0016*dt; pitchT+= .00030*Math.sin(ts*.00023)*dt; scaleT+=.00022*Math.sin(ts*.00017)*dt; pitchT=Math.max(-1.2,Math.min(1.2,pitchT)); scaleT=Math.max(.30,Math.min(2.1,scaleT));}
  yaw+=(yawT-yaw)*.12; pitch+=(pitchT-pitch)*.12; scale+=(scaleT-scale)*.15;
  breathNow=1+.020*Math.sin(ts*.0011)+.004*Math.sin(ts*.0053);
  for(let r=0;r<8;r++)act[r]=Math.max(0,act[r]*.955);
  let anyOpen=-1;
  for(let r=0;r<8;r++){
    const xt=view===2?1:xrayT[r];

    fT=a0<1.6?1:.65;
  }

  const mfT=(view===1?.05:1)*(1-.62*focusF),
        dgT=(view===1?.12:1)*(1-.85*focusF),
        abT=view===1?.30:.05,
        fgT=(view===1?.28:1)*(1-.85*focusF);

  dustGain+=(dgT-dustGain)*Math.min(1,.10*dt);
  axBase+=(abT-axBase)*Math.min(1,.10*dt);
  fibGain+=(fgT-fibGain)*Math.min(1,.10*dt);
  for(let k=pulses.length-1;k>=0;k--){
    const p=pulses[k];
    p.t+=p.v*dt;
    if(p.t>=1){
      const [a,b]=edges[p.e];
      neurons[b].flash=1;
      act[neurons[b].c]=Math.min(1,act[neurons[b].c]+.045);
      if(p.dies&&R()<.5){pulses.splice(k,1);continue;}
      const na=adj[b];
      p.e=na.length&&R()<.72?na[(R()*na.length)|0]:(R()*edges.length)|0;
      p.t=0;
    }
  }
  for(const n of neurons)n.flash*=.93;
  const stormGap=anyOpen>=0?1600:5200;
  if(ts-lastStorm>stormGap){lastStorm=ts;
    if(anyOpen>=0){const m=[...neurons.keys()].filter(i=>neurons[i].c===anyOpen);
      fireThought(m[(R()*m.length)|0]);}
    else fireThought((R()*NN)|0);}

  gl.viewport(0,0,fbW,fbH);

  attribs({0:[bInP,3],1:[bInC,3],2:[bInS,1],3:[bInR,1]});

  gl.useProgram(pWeb);setCam(pWeb,ts);
  gl.uniform1fv(gl.getUniformLocation(pWeb,'uXray'),xray);
  gl.uniform1f(gl.getUniformLocation(pWeb,'uDim'),1-.85*focusF);

  gl.drawArrays(gl.LINES,0,webVertCount);
  gl.useProgram(pSpark);setCam(pSpark,ts);
  gl.uniform1fv(gl.getUniformLocation(pSpark,'uXray'),xray);
  gl.uniform3f(gl.getUniformLocation(pSpark,'uMouse'),mouse3[0],mouse3[1],mouse3[2]);
  gl.uniform1f(gl.getUniformLocation(pSpark,'uGain'),Math.max(.55,dustGain));
  attribs({0:[bLatP,3],1:[bLatC,3],2:[bLatS,1],3:[bLatR,1]});
  gl.drawArrays(gl.POINTS,0,NLAT);
  gl.useProgram(pRib);setCam(pRib,ts);
  gl.uniform1f(gl.getUniformLocation(pRib,'uGain'),fibGain);
  attribs({0:[bRib,3],1:[bRibC,3]});
  gl.vertexAttrib1f(2,-1);
  gl.drawArrays(gl.LINES,0,ribPts.length/3);
  /* electric interior shines through opened lobes */
  gl.useProgram(pAxon);setCam(pAxon,ts);
  gl.uniform1fv(gl.getUniformLocation(pAxon,'uXray'),xray);
  gl.uniform1f(gl.getUniformLocation(pAxon,'uMode'),1);
  gl.uniform1f(gl.getUniformLocation(pAxon,'uBase'),axBase);
  gl.disable(gl.DEPTH_TEST);
  attribs({0:[bAxon,3],2:[bAxonR,1]});
  gl.vertexAttrib3f(1,.55,.72,1);
  gl.drawArrays(gl.LINES,0,axonVerts.length/3);
  gl.enable(gl.DEPTH_TEST);
  gl.useProgram(pSpark);setCam(pSpark,ts);
  gl.uniform1fv(gl.getUniformLocation(pSpark,'uXray'),xray);
  gl.uniform3f(gl.getUniformLocation(pSpark,'uMouse'),mouse3[0],mouse3[1],mouse3[2]);
  gl.uniform1f(gl.getUniformLocation(pSpark,'uGain'),dustGain);
  attribs({0:[bSparkP,3],1:[bSparkC,3],2:[bSparkS,1],3:[bSparkR,1]});
  gl.drawArrays(gl.POINTS,0,NSPK);
  gl.useProgram(pFib);setCam(pFib,ts);
  gl.uniform1f(gl.getUniformLocation(pFib,'uGain'),fibGain);
  attribs({0:[bFib,3],1:[bFibC,3],2:[bFibM,4]});
  gl.drawArrays(gl.POINTS,0,fibCount);

  /* lightning strikes: jittering arcs from the chosen file to its kin */
  let bv=0;
  for(const bl of bolts){
    if(bl.t0<0)bl.t0=ts;
    const A=neurons[bl.i], B=neurons[bl.j];
    const age=(ts-bl.t0)/1000;
    const head=Math.min(1,age/.35);

    act[B.c]=Math.min(1,act[B.c]+.020*dt*head);
    if(head>=1&&!bl.hit){bl.hit=true;B.flash=1;act[B.c]=Math.min(1,act[B.c]+.35);

    const rep2=age>1.2?((age-1.2)%2.2):99;
    if(rep2<.30)settle=Math.max(settle,1.-rep2*1.5);
    const dx=B.x-A.x, dy=B.y-A.y, dz=B.z-A.z;
    const L=Math.hypot(dx,dy,dz)||1;
    let p1x=dy/L,p1y=-dx/L,p1z=0;
    const pl=Math.hypot(p1x,p1y,p1z)||1; p1x/=pl;p1y/=pl;p1z/=pl;
    const p2x=(dy*p1z-dz*p1y)/L, p2y=(dz*p1x-dx*p1z)/L, p2z=(dx*p1y-dy*p1x)/L;
    for(let pass=0;pass<2;pass++){
      let lx=A.x,ly=A.y,lz=A.z;
      for(let sg=1;sg<=BSEG;sg++){
        const u=sg/BSEG;
        if(u>head)break;
        const env=Math.sin(Math.PI*u)*Math.min(.11,.05+L*.06)*settle*(pass?1.7:1);
        const j1=(vnoise(bl.seed+u*9+pass*37, ts*.006, bl.seed)-.5)*2;
        const j2=(vnoise(bl.seed+u*9+61+pass*17, ts*.005, bl.seed+9)-.5)*2;
        const px=A.x+dx*u+(p1x*j1+p2x*j2)*env;
        const py=A.y+dy*u+(p1y*j1+p2y*j2)*env;
        const pz=A.z+dz*u+(p1z*j1+p2z*j2)*env;
        if(bv<boltV.length-6){
          boltV[bv]=lx;boltV[bv+1]=ly;boltV[bv+2]=lz;
          boltV[bv+3]=px;boltV[bv+4]=py;boltV[bv+5]=pz;
          const w=(pass?0.55:1.0)*settle*(1-.25*Math.abs(2*u-1));
          const cb=pass?[.55,.8,1]:[1,1,1];
          boltC[bv]=cb[0]*w;boltC[bv+1]=cb[1]*w;boltC[bv+2]=cb[2]*w;
          boltC[bv+3]=cb[0]*w;boltC[bv+4]=cb[1]*w;boltC[bv+5]=cb[2]*w;
          bv+=6;
        }
        lx=px;ly=py;lz=pz;
      }
    }
  }
  /* (bolt bodies are rendered as dense overlapping sprites in the dot pass) */

  /* thoughts + neuron ghosts: x-ray through the shell */
  gl.disable(gl.DEPTH_TEST);
  let nd=0;
  for(let i=0;i<NN;i++){
    const n=neurons[i];
    const [r,g,b]=nCol[i];
    const xr=xray[n.c];
    const imp=showImp&&important.includes(i);
    let gh=(.42+.85*xr)*(view===1?1.9:1);
    if(showImp) gh*=imp?1.25:.5;
    const breathe=1+.1*Math.sin(ts*.0019+n.ph);
    dotPos[nd*3]=n.x;dotPos[nd*3+1]=n.y;dotPos[nd*3+2]=n.z;
    const f=n.flash;
    dotCol[nd*3]=Math.min(1,r+f)*gh;dotCol[nd*3+1]=Math.min(1,g+f)*gh;dotCol[nd*3+2]=Math.min(1,b+f)*gh;
    dotSize[nd]=((3.0+Math.min(5,Math.sqrt(n.deg)*1.4))*breathe+(i===selected?2.5:0)+(i===hovered?1.5:0)+f*3)*(1+xr*1.15)*(view===1?1.45:1)+(imp?2.5:0);
    nd++;
  }
  /* electric: long jittering comet trails */
  for(const bl of bolts){
    if(bl.t0<0)continue;
    const A=neurons[bl.i],B=neurons[bl.j];
    const age=(ts-bl.t0)/1000;
    const head=Math.min(1,age/.35);
    const dxg=B.x-A.x, dyg=B.y-A.y, dzg=B.z-A.z;
    const Lg=Math.hypot(dxg,dyg,dzg)||1;
    const age2=(ts-bl.t0)/1000;
    let sett=age2<1.2?1:.55;
    const rep3=age2>1.2?((age2-1.2)%2.2):99;
    if(rep3<.30)sett=Math.max(sett,1.-rep3*1.2);
    const glowN=Math.max(24,Math.min(60,(Lg*80)|0));
    for(let g3=1;g3<glowN;g3++){
      if(nd>=MAXDOT-4)break;
      const u=g3/glowN;
      if(u>head)break;
      const j1=(vnoise(bl.seed+u*9, ts*.006, bl.seed)-.5)*2;
      const j2=(vnoise(bl.seed+u*9+61, ts*.005, bl.seed+9)-.5)*2;
      const env=Math.sin(Math.PI*u)*Math.min(.11,.05+Lg*.06)*sett;
      const px2=A.x+dxg*u+(j1*env)*.55, py2=A.y+dyg*u+(j2*env)*.55, pz2=A.z+dzg*u;
      const hot=1-.30*Math.abs(2*u-1);
      const vary=.7+.55*vnoise(bl.seed*3+u*22, ts*.01, 4.2);
      const gw=(.92+.08*Math.sin(ts*.016+bl.seed+u*24))*sett*hot;
      /* wide cool halo — overlapping for a continuous beam */
      dotPos[nd*3]=px2;dotPos[nd*3+1]=py2;dotPos[nd*3+2]=pz2;
      dotCol[nd*3]=gw*.40;dotCol[nd*3+1]=gw*.72;dotCol[nd*3+2]=gw;
      dotSize[nd]=(19+10*Math.sin(Math.PI*u))*vary*(.7+.3*sett);
      nd++;
      /* blown white core */
      dotPos[nd*3]=px2;dotPos[nd*3+1]=py2;dotPos[nd*3+2]=pz2;
      dotCol[nd*3]=1.7*gw;dotCol[nd*3+1]=1.7*gw;dotCol[nd*3+2]=1.65*gw;
      dotSize[nd]=(8.5+5.5*Math.sin(Math.PI*u))*vary*(.7+.3*sett);
      nd++;
      /* crackle filament: displaced thin secondary chain */
      if(g3%2===0&&nd<MAXDOT-2){
        dotPos[nd*3]=A.x+dxg*u+(j2*env)*1.5;
        dotPos[nd*3+1]=A.y+dyg*u+(j1*env)*1.5;
        dotPos[nd*3+2]=pz2;
        dotCol[nd*3]=gw*.8;dotCol[nd*3+1]=gw*.9;dotCol[nd*3+2]=gw;
        dotSize[nd]=3.2*vary;
        nd++;
      }
    }
    /* source flare: the hottest pixel in frame lives at the origin */
    if(nd<MAXDOT-2){
      const fl=(.8+.2*Math.sin(ts*.02+bl.seed))*sett;
      dotPos[nd*3]=A.x;dotPos[nd*3+1]=A.y;dotPos[nd*3+2]=A.z;
      dotCol[nd*3]=1.8*fl;dotCol[nd*3+1]=1.8*fl;dotCol[nd*3+2]=1.75*fl;
      dotSize[nd]=20*fl+6;
      nd++;
    }
    if(bl.hit&&nd<MAXDOT-2&&(ts-bl.t0)/1000<1.35){
      dotPos[nd*3]=B.x;dotPos[nd*3+1]=B.y;dotPos[nd*3+2]=B.z;
      const bw=Math.max(0,1-((ts-bl.t0)/1000-.35)/1.0);
      dotCol[nd*3]=1.7*bw;dotCol[nd*3+1]=1.7*bw;dotCol[nd*3+2]=1.65*bw;
      dotSize[nd]=24*bw+5;
      nd++;
    }
    if(nd<MAXDOT-2){
      const hx=A.x+(B.x-A.x)*head, hy=A.y+(B.y-A.y)*head, hz=A.z+(B.z-A.z)*head;
      dotPos[nd*3]=hx;dotPos[nd*3+1]=hy;dotPos[nd*3+2]=hz;
      const hw=head<1?1:.5+.5*Math.sin(ts*.02+bl.seed);
      dotCol[nd*3]=hw;dotCol[nd*3+1]=hw;dotCol[nd*3+2]=hw;
      dotSize[nd]=head<1?9:5.5;
      nd++;
    }
  }
  for(const p of pulses){
    const xr=xray[neurons[edges[p.e][0]].c];
    const trail=3+(xr>.3?3:0);
    for(let g2=0;g2<trail;g2++){
      if(nd>=MAXDOT)break;
      const tt=Math.max(0,p.t-g2*.045);
      const [x,y,z]=axonPoint(p.e,tt);
      const j=g2===0?0:.006*(1+xr*1.5);
      dotPos[nd*3]=x+(R()-.5)*j;dotPos[nd*3+1]=y+(R()-.5)*j;dotPos[nd*3+2]=z+(R()-.5)*j;
      const w=(1-g2/trail)*(0.8+xr*.5);
      dotCol[nd*3]=w;dotCol[nd*3+1]=w*.94;dotCol[nd*3+2]=w*(.75+.25*xr);
      dotSize[nd]=(3.6-g2*.5)*(1+xr*.4);
      nd++;
    }
  }
  gl.useProgram(pDot);setCam(pDot,ts);
  gl.uniform1f(gl.getUniformLocation(pDot,'uGhost'),.5);
  gl.bindBuffer(gl.ARRAY_BUFFER,bDotP);gl.bufferData(gl.ARRAY_BUFFER,dotPos.subarray(0,nd*3),gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,bDotC);gl.bufferData(gl.ARRAY_BUFFER,dotCol.subarray(0,nd*3),gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,bDotS);gl.bufferData(gl.ARRAY_BUFFER,dotSize.subarray(0,nd),gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(2);gl.vertexAttribPointer(2,1,gl.FLOAT,false,0,0);
  gl.disableVertexAttribArray(3);
  gl.drawArrays(gl.POINTS,0,nd);

  /* mini navigator: the whole brain, flat region tints, corner viewport */
  {
    const mw=196*DPR, mh=150*DPR;
    const mx=18*DPR;
    const gy=fbH-(16*DPR)-mh;
    gl.enable(gl.SCISSOR_TEST);
    gl.scissor(mx,gy,mw,mh);
    gl.clear(gl.DEPTH_BUFFER_BIT);
    gl.viewport(mx,gy,mw,mh);
    gl.enable(gl.DEPTH_TEST);
    gl.depthMask(true);
    gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(pMesh);
    gl.uniform1f(gl.getUniformLocation(pMesh,'uYaw'),yaw);
    gl.uniform1f(gl.getUniformLocation(pMesh,'uPitch'),pitch);
    gl.uniform1f(gl.getUniformLocation(pMesh,'uScale'),.95);
    gl.uniform1f(gl.getUniformLocation(pMesh,'uAspect'),mw/mh);
    gl.uniform1f(gl.getUniformLocation(pMesh,'uBreath'),1);
    gl.uniform1f(gl.getUniformLocation(pMesh,'uT'),ts/1000);
    gl.uniform1f(gl.getUniformLocation(pMesh,'uFade'),1);
    gl.uniform1fv(gl.getUniformLocation(pMesh,'uAct'),act);
    gl.uniform1f(gl.getUniformLocation(pMesh,'uMini'),1);
    gl.uniform1f(gl.getUniformLocation(pMesh,'uMiniHov'),miniHover);
    gl.uniform1fv(gl.getUniformLocation(pMesh,'uXray'),xray);
    drawMesh(mCortex,ts);
    drawMesh(mCereb,ts);
    drawMesh(mStem,ts);
    gl.uniform1f(gl.getUniformLocation(pMesh,'uMini'),0);
    gl.disable(gl.SCISSOR_TEST);
    gl.depthMask(false);
    gl.disable(gl.DEPTH_TEST);
    gl.viewport(0,0,fbW,fbH);
  }

  /* bloom + grade */
  gl.disable(gl.BLEND);
  const hw=fbW>>1, hh=fbH>>1;
  postPass(pBright,fbA,txScene,null,hw,hh,0,0);
  postPass(pBlur,fbB,txA,null,hw,hh,1.6/hw,0);
  postPass(pBlur,fbA,txB,null,hw,hh,0,1.6/hh);
  postPass(pBlur,fbB,txA,null,hw,hh,2.6/hw,0);
  postPass(pBlur,fbA,txB,null,hw,hh,0,2.6/hh);
  /* god rays sample the bright pass before the bloom blurs eat it */
  postPass(pRays,fbC,txA,null,hw,hh,0,0);
  postPass(pBlur,fbD,txC,null,hw,hh,1.8/hw,0);
  postPass(pBlur,fbC,txD,null,hw,hh,0,1.8/hh);
  /* DOF: blurred copy of the whole scene */
  postPass(pBlur,fbD,txScene,null,hw,hh,2.2/hw,0);
  postPass(pBlur,fbB,txD,null,hw,hh,0,2.2/hh);
  postPass(pBlur,fbD,txB,null,hw,hh,3.4/hw,0);
  postPass(pBlur,fbB,txD,null,hw,hh,0,3.4/hh);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,fbW,fbH);
  gl.useProgram(pComp);
  gl.activeTexture(gl.TEXTURE2);
  gl.bindTexture(gl.TEXTURE_2D,txB);
  gl.uniform1i(gl.getUniformLocation(pComp,'uBlur'),2);
  gl.activeTexture(gl.TEXTURE3);
  gl.bindTexture(gl.TEXTURE_2D,txC);
  gl.uniform1i(gl.getUniformLocation(pComp,'uRays'),3);
  postPass(pComp,null,txScene,txA,fbW,fbH,0,0);

  /* HUD */
  hctx.clearRect(0,0,W,H);
  for(let k=rings.length-1;k>=0;k--){
    const rg=rings[k];
    const age=(ts-rg.t0)/1000;
    if(age>.8){rings.splice(k,1);continue;}
    const nn3=neurons[rg.i];
    if(!project([nn3.x,nn3.y,nn3.z],_p))continue;
    const fw=1-age/.8;
    hctx.strokeStyle=`rgba(255,255,255,${(.9*fw).toFixed(3)})`;
    hctx.lineWidth=2.2;
    hctx.beginPath();hctx.arc(_p[0],_p[1],4+age*52,0,7);hctx.stroke();
    hctx.strokeStyle=`rgba(150,215,255,${(.6*fw).toFixed(3)})`;
    hctx.lineWidth=1.2;
    hctx.beginPath();hctx.arc(_p[0],_p[1],4+age*30,0,7);hctx.stroke();
  }
  if(showImp){
    hctx.font='600 10.5px system-ui,sans-serif';
    for(const i of important){
      const nn2=neurons[i];
      if(!project([nn2.x,nn2.y,nn2.z],_p))continue;
      hctx.strokeStyle='rgba(255,196,110,.75)';hctx.lineWidth=1.1;
      hctx.beginPath();hctx.arc(_p[0],_p[1],9,0,7);hctx.stroke();
      hctx.fillStyle='rgba(0,0,0,.6)';hctx.fillText(nn2.name,_p[0]+13,_p[1]+3.6);
      hctx.fillStyle='rgba(255,224,178,.95)';hctx.fillText(nn2.name,_p[0]+12.4,_p[1]+3);
    }
  }
  if(selected>=0&&project([neurons[selected].x,neurons[selected].y,neurons[selected].z],_p)){
    hctx.strokeStyle='rgba(255,220,160,.9)';hctx.lineWidth=1.4;
    hctx.beginPath();hctx.arc(_p[0],_p[1],14+2*Math.sin(ts*.004),0,7);hctx.stroke();
    hctx.font='600 11px system-ui,sans-serif';
    const nm=neurons[selected].name;
    hctx.fillStyle='rgba(0,0,0,.6)';hctx.fillText(nm,_p[0]+19,_p[1]+4.6);
    hctx.fillStyle='rgba(240,232,216,.95)';hctx.fillText(nm,_p[0]+18.4,_p[1]+4);
    /* linked files stay marked while the selection holds */
    hctx.font='500 10px system-ui,sans-serif';
    const cells=new Set();
    for(const bl of bolts){
      const nb=neurons[bl.j];
      if(!project([nb.x,nb.y,nb.z],_p))continue;
      const pulse=.65+.30*Math.sin(ts*.005+bl.seed);
      hctx.strokeStyle=`rgba(150,215,255,${pulse.toFixed(3)})`;
      hctx.lineWidth=1.4;
      hctx.beginPath();hctx.arc(_p[0],_p[1],7,0,7);hctx.stroke();
      const a0=ts*.0016;
      hctx.strokeStyle=`rgba(150,215,255,${(pulse*.7).toFixed(3)})`;
      hctx.lineWidth=1.1;
      for(let q=0;q<3;q++){
        hctx.beginPath();hctx.arc(_p[0],_p[1],12.5,a0+q*2.094,a0+q*2.094+1.25);hctx.stroke();
      }
      for(let q=0;q<4;q++){
        const aa=q*Math.PI/2+Math.PI/4;
        hctx.beginPath();
        hctx.moveTo(_p[0]+Math.cos(aa)*16,_p[1]+Math.sin(aa)*16);
        hctx.lineTo(_p[0]+Math.cos(aa)*20,_p[1]+Math.sin(aa)*20);
        hctx.stroke();
      }
      const cell=((_p[0]/90)|0)+':'+((_p[1]/22)|0);
      if(cells.has(cell))continue;
      cells.add(cell);
      hctx.font='500 10px system-ui,sans-serif';
      const tw=hctx.measureText(nb.name).width;
      hctx.fillStyle='rgba(6,11,22,.78)';
      hctx.beginPath();hctx.roundRect(_p[0]+20,_p[1]-8,tw+14,17,5);hctx.fill();
      hctx.strokeStyle='rgba(150,215,255,.30)';hctx.lineWidth=1;
      hctx.beginPath();hctx.roundRect(_p[0]+20,_p[1]-8,tw+14,17,5);hctx.stroke();
      hctx.fillStyle='rgba(200,230,255,.97)';hctx.fillText(nb.name,_p[0]+27,_p[1]+4);
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body></html>
