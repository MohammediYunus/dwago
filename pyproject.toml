[project]
name = "dwago"
version = "0.3.2"
description = "Ask your codebase anything. Tree-sitter graph, git-history mining, cited answers, and a brain map that shares the search index."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

# Core stays deliberately small: everything here is pure-CPU, no model downloads.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "networkx>=3.4",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-ruby>=0.23",
    "tree-sitter-php>=0.23",
]

[project.optional-dependencies]
# Lexical retrieval (Phase 2).
lexical = ["bm25s>=0.3.10"]
# Dense retrieval with a real transformer encoder.
dense = ["sentence-transformers>=3.0", "torch>=2.2"]
# Cross-encoder reranking.
rerank = ["sentence-transformers>=3.0", "torch>=2.2"]
# Pure-numpy static embeddings: the --fast path, no torch.
fast = ["model2vec>=0.9.0"]
# Approximate NN above the brute-force threshold.
ann = ["usearch>=2.20"]
# CJK identifier/comment segmentation (parity with graphify's _segment_chinese).
cjk = ["jieba>=0.42"]
# SCIP protobuf ingestion (Phase 5).
scip = ["protobuf>=5.0"]
# Importing a graph.json produced by another extractor.
compat = []
# MCP server (Phase 3).
mcp = ["mcp>=2,<3"]

dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
dwago = "dwago.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dwago"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
